<div class="card">
    @if (selectedLeaguesError()) {
        <div class="text-danger mt-1">
            <div style="color: red" class="alert alert-danger">{{ selectedLeaguesError() }}</div>
        </div>
    }
    <!-- select the league from the list -->
    <div class="justify-left items-center p-1">
        <p-autocomplete [(ngModel)]="selectedCountry" [forceSelection]="true" [suggestions]="filteredCountries"
                        (onSelect)="onSelectCountry($event)"  (onUnselect)="onCountryUnselect()" (onClear)="onCountryUnselect()"
                        (completeMethod)="filterCountry($event)" optionLabel="nameNL" [showClear]="true" inputStyleClass="w-56"/>
    </div>
    <div class="card">
        <p-accordion [value]="['0']" (valueChange)="onCountryOpenTab($event)">
            @for (country of (selectedCountries() || []); track country.countryCode) {
                <p-accordion-panel [value]="country.countryCode">
                    <p-accordion-header>
                    <span class="flex items-center gap-2">
                        <img [src]="country.flagUrl" [alt]="country.nameNL" style="width: 20px; vertical-align: middle;" />
                         <span>{{ country.nameNL }}</span>
                    </span>
                    </p-accordion-header>
                    <p-accordion-content>
                        <p-dataview #dv [value]="selectedLeagues()" [emptyMessage]="selectedLeagues() == null ? 'Geen competities gevonden' : 'Bezig met ophalen'">
                            <ng-template #list let-leagues>
                                <div class="flex flex-col w-full">
                                    <div *ngFor="let league of leagues; let last = last"
                                         class="flex items-center justify-between p-3 gap-4"
                                         [ngClass]="{'border-b border-surface-200 dark:border-surface-700': !last && leagues.length > 1}">
                                        <!-- Logo & Name (Left aligned) -->
                                        <div class="flex items-center gap-3 min-w-0 flex-1">
                                            <img [src]="league.logo" class="shadow-md rounded" alt="{{ league.name }}" width="45" />
                                            <span class="font-medium truncate">{{ league.name }}</span>
                                        </div>

                                        <!-- Season & Dates (Centered column) -->
                                        <div class="flex flex-col items-center justify-center text-sm text-surface-600 dark:text-surface-400 whitespace-nowrap flex-1 text-center">
                                            <span class="font-semibold">Seizoen: {{ league.season }}</span>
                                            <span>{{ league.start | date: 'dd/MM/yyyy' }} - {{ league.end | date: 'dd/MM/yyyy' }}</span>
                                        </div>

                                        <!-- Glass Search Icon Button (Right aligned) -->
                                        <div class="flex-shrink-0 flex-1 flex justify-end">
                                            <p-button icon="pi pi-search" [rounded]="true" [text]="true" severity="secondary" (onClick)="selectLeague(league)" />
                                        </div>
                                    </div>
                                </div>
                            </ng-template>
                        </p-dataview>
                    </p-accordion-content>
                </p-accordion-panel>
            }
        </p-accordion>
    </div>
    <!-- end selection -->
</div>
