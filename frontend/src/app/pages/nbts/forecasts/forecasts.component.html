<div class="card">
    <div class="card">
        <p-accordion [value]="['0']" (valueChange)="onCountryOpenTab($event)">
            @for (country of (selectedCountries() || []); track country.countryCode) {
                <p-accordion-panel [value]="country.countryCode">
                    <p-accordion-header>
                            <span class="flex items-center gap-2">
                                <img [src]="country.flagUrl" [alt]="country.nameNL" style="width: 20px; vertical-align: middle;" />
                                <span>{{ country.nameNL }}</span>
                            </span>
                    </p-accordion-header>
                    <p-accordion-content>
                        <p-treetable [value]="treeMapLeagueData()" [scrollable]="true" [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template #header>
                                <tr>
                                    <th>Competitie</th>
                                    <th>Team</th>
                                    <th>Volgende match</th>
                                    <th>score match</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-rowNode let-rowData="rowData" let-columns="columns">
                                <tr [ttRow]="rowNode">
                                    @for (col of treeMapLeagueColumns(); let first = $first; track col) {
                                        <td>
                                            @if (first) {
                                                <div class="flex items-center gap-2">
                                                    <p-treetable-toggler [rowNode]="rowNode"></p-treetable-toggler>
                                                    <span>{{ rowData[col.field] }}</span>
                                                </div>
                                            } @else {
                                                {{ rowData[col.field] }}
                                            }
                                        </td>
                                    }
                                </tr>
                            </ng-template>
                        </p-treetable>
                    </p-accordion-content>
                </p-accordion-panel>
            }
        </p-accordion>
    </div>


</div>
